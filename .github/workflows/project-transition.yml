name: Project Transition From Commit

on:
  push:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  projects: write

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - name: Parse commit commands and update project status
        uses: actions/github-script@v7
        env:
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PROJECT_TITLE: ${{ vars.PROJECT_TITLE }}
          STATUS_FIELD_NAME: ${{ vars.STATUS_FIELD_NAME }}
          COMMENT_ON_TRANSITION: ${{ vars.COMMENT_ON_TRANSITION }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = process.env.PROJECT_OWNER || context.repo.owner;
            const repo = context.repo.repo;
            const projectNumber = Number(process.env.PROJECT_NUMBER || "0");
            const projectTitle = (process.env.PROJECT_TITLE || "").trim();
            const statusFieldName = process.env.STATUS_FIELD_NAME || "Status";
            const commentOnTransition = (process.env.COMMENT_ON_TRANSITION || "false").toLowerCase() === "true";
            const transitions = { plan: "策划完成" };
            const commandRegex = /\b(plan)\s+#(\d+)\b/ig;

            const commits = context.payload.commits || [];
            if (!commits.length) {
              core.info("No commits found in payload, nothing to do.");
              return;
            }

            const actions = [];
            for (const commit of commits) {
              const message = commit.message || "";
              let match;
              while ((match = commandRegex.exec(message)) !== null) {
                actions.push({
                  issueNumber: Number(match[2]),
                  command: String(match[1]).toLowerCase(),
                  sha: commit.id,
                });
              }
              commandRegex.lastIndex = 0;
            }

            if (!actions.length) {
              core.info("No transition commands found in commit messages.");
              return;
            }

            core.info(`Found ${actions.length} transition command(s).`);

            const issueQuery = `
              query($owner: String!, $repo: String!, $issueNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issueNumber) {
                    id
                    number
                    url
                    title
                    projectItems(first: 50) {
                      nodes {
                        id
                        project {
                          id
                          number
                          title
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectByNumberQuery = `
              query($owner: String!, $number: Int!) {
                organization(login: $owner) {
                  projectV2(number: $number) {
                    id
                    number
                    title
                  }
                }
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    number
                    title
                  }
                }
              }
            `;

            const projectDetailQuery = `
              query($projectId: ID!, $itemId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    id
                    number
                    title
                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
                nodeItem: node(id: $itemId) {
                  ... on ProjectV2Item {
                    id
                    fieldValues(first: 50) {
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          optionId
                          field {
                            ... on ProjectV2SingleSelectField {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            for (const action of actions) {
              const targetStatus = transitions[action.command];
              if (!targetStatus) {
                core.warning(`No transition mapping for command '${action.command}', skipped #${action.issueNumber}`);
                continue;
              }

              const issueResp = await github.graphql(issueQuery, {
                owner,
                repo,
                issueNumber: action.issueNumber,
              });

              const issue = issueResp.repository?.issue;
              if (!issue) {
                core.warning(`Issue #${action.issueNumber} not found in ${owner}/${repo}.`);
                continue;
              }

              const projectItems = issue.projectItems.nodes || [];
              if (!projectItems.length) {
                core.warning(`Issue #${issue.number} is not in any project, skipped.`);
                continue;
              }

              let item;
              if (projectNumber) {
                const projectResp = await github.graphql(projectByNumberQuery, {
                  owner,
                  number: projectNumber,
                });
                const selectedProject = projectResp.organization?.projectV2 || projectResp.user?.projectV2;
                if (!selectedProject) {
                  core.warning(`Project v2 not found: owner=${owner}, number=${projectNumber}, skipped #${issue.number}`);
                  continue;
                }
                item = projectItems.find((n) => n?.project?.id === selectedProject.id);
                if (!item) {
                  core.warning(`Issue #${issue.number} is not in project #${projectNumber}, skipped.`);
                  continue;
                }
              } else {
                let candidates = projectItems;
                if (projectTitle) {
                  candidates = candidates.filter((n) => n?.project?.title === projectTitle);
                }
                if (candidates.length !== 1) {
                  const titles = candidates.map((n) => `${n?.project?.title || "unknown"}(#${n?.project?.number || "?"})`).join(", ");
                  core.warning(
                    `Issue #${issue.number} matches ${candidates.length} project items (${titles || "none"}). Set PROJECT_NUMBER or PROJECT_TITLE to disambiguate.`
                  );
                  continue;
                }
                item = candidates[0];
              }

              const projectDetailResp = await github.graphql(projectDetailQuery, {
                projectId: item.project.id,
                itemId: item.id,
              });
              const project = projectDetailResp.node;
              const itemDetail = projectDetailResp.nodeItem;
              if (!project || !itemDetail) {
                core.warning(`Failed to load project/item details for issue #${issue.number}, skipped.`);
                continue;
              }

              const statusField = (project.fields.nodes || []).find((f) => f && f.name === statusFieldName);
              if (!statusField) {
                core.warning(`Status field '${statusFieldName}' not found in project '${project.title}', skipped #${issue.number}`);
                continue;
              }

              const optionByName = new Map((statusField.options || []).map((o) => [o.name, o.id]));
              const targetOptionId = optionByName.get(targetStatus);
              if (!targetOptionId) {
                core.warning(`Status option '${targetStatus}' not found in project '${project.title}', skipped #${issue.number}`);
                continue;
              }

              const currentStatusValue = (itemDetail.fieldValues.nodes || []).find(
                (v) => v?.field?.id === statusField.id
              );
              const currentStatusName = currentStatusValue?.name || "(empty)";
              if (currentStatusValue?.optionId === targetOptionId) {
                core.info(`#${issue.number} already '${targetStatus}', skipped.`);
                continue;
              }

              await github.graphql(updateMutation, {
                projectId: project.id,
                itemId: item.id,
                fieldId: statusField.id,
                optionId: targetOptionId,
              });

              core.info(
                `Updated #${issue.number}: '${currentStatusName}' -> '${targetStatus}' (command: ${action.command}, commit: ${action.sha.slice(0, 7)})`
              );

              if (commentOnTransition) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Auto transition by commit \`${action.sha.slice(0, 7)}\`: \`${action.command} #${issue.number}\` -> **${targetStatus}**`,
                });
              }
            }
