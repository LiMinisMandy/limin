name: Project Transition From Commit

on:
  push:
    branches:
      - master
      - main
      - develop
  issues:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - name: Parse commit commands and update project status
        uses: actions/github-script@v7
        env:
          HAS_PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN != '' }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          STATUS_FIELD_NAME: ${{ vars.STATUS_FIELD_NAME }}
          COMMENT_ON_TRANSITION: ${{ vars.COMMENT_ON_TRANSITION }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = process.env.PROJECT_OWNER || context.repo.owner;
            const repo = context.repo.repo;
            const projectNumber = Number(process.env.PROJECT_NUMBER || "1");
            const statusFieldName = process.env.STATUS_FIELD_NAME || "Status";
            const commentOnTransition = (process.env.COMMENT_ON_TRANSITION || "false").toLowerCase() === "true";
            if (process.env.HAS_PROJECT_TOKEN !== "true") {
              core.setFailed("PROJECT_TOKEN secret is required for updating user-owned Project v2 items.");
              return;
            }
            const commitTransitions = {
              plan: "策划完成",
              rd_done: "研发完成",
              req_accept_done: "需求验收完成",
              testing: "测试中",
              implemented: "已实现",
              rejected: "已拒绝"
            };
            const commandRegex = /\b(plan|rd_done|req_accept_done|testing|implemented|rejected)\s+#(\d+)\b/ig;

            const ownerResp = await github.rest.users.getByUsername({ username: owner });
            const ownerType = ownerResp.data?.type;
            const projectQuery =
              ownerType === "Organization"
                ? `
                    query($owner: String!, $number: Int!) {
                      organization(login: $owner) {
                        projectV2(number: $number) {
                          id
                          title
                          number
                          fields(first: 100) {
                            nodes {
                              ... on ProjectV2SingleSelectField {
                                id
                                name
                                options {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  `
                : `
                    query($owner: String!, $number: Int!) {
                      user(login: $owner) {
                        projectV2(number: $number) {
                          id
                          title
                          number
                          fields(first: 100) {
                            nodes {
                              ... on ProjectV2SingleSelectField {
                                id
                                name
                                options {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  `;

            const projectResp = await github.graphql(projectQuery, {
              owner,
              number: projectNumber,
            });

            const project = projectResp.organization?.projectV2 || projectResp.user?.projectV2;
            if (!project) {
              core.setFailed(`Project v2 not found: owner=${owner}, number=${projectNumber}`);
              return;
            }

            const statusField = (project.fields.nodes || []).find((f) => f && f.name === statusFieldName);
            if (!statusField) {
              core.setFailed(`Status field '${statusFieldName}' not found in project #${projectNumber}.`);
              return;
            }

            const optionByName = new Map((statusField.options || []).map((o) => [o.name, o.id]));
            const issueQuery = `
              query($owner: String!, $repo: String!, $issueNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issueNumber) {
                    id
                    number
                    url
                    title
                    projectItems(first: 50) {
                      nodes {
                        id
                        project {
                          id
                          number
                          title
                        }
                        fieldValues(first: 50) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              optionId
                              field {
                                ... on ProjectV2SingleSelectField {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            async function setIssueProjectStatus(issueNumber, targetStatus, sourceLabel) {
              if (!targetStatus) return false;

              const targetOptionId = optionByName.get(targetStatus);
              if (!targetOptionId) {
                core.warning(`Status option '${targetStatus}' not found in project field '${statusFieldName}', skipped #${issueNumber}`);
                return false;
              }

              const issueResp = await github.graphql(issueQuery, {
                owner,
                repo,
                issueNumber,
              });

              const issue = issueResp.repository?.issue;
              if (!issue) {
                core.warning(`Issue #${issueNumber} not found in ${owner}/${repo}.`);
                return false;
              }

              const item = (issue.projectItems.nodes || []).find((n) => n?.project?.id === project.id);
              if (!item) {
                core.warning(`Issue #${issue.number} is not visible in project #${projectNumber} for current token, skipped.`);
                return false;
              }

              const currentStatusValue = (item.fieldValues.nodes || []).find(
                (v) => v?.field?.id === statusField.id
              );
              const currentStatusName = currentStatusValue?.name || "(empty)";
              if (currentStatusValue?.optionId === targetOptionId) {
                core.info(`#${issue.number} already '${targetStatus}', skipped.`);
                return true;
              }

              await github.graphql(updateMutation, {
                projectId: project.id,
                itemId: item.id,
                fieldId: statusField.id,
                optionId: targetOptionId,
              });

              core.info(
                `Updated #${issue.number}: '${currentStatusName}' -> '${targetStatus}' (${sourceLabel})`
              );

              if (commentOnTransition) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Auto transition (${sourceLabel}) -> **${targetStatus}**`,
                });
              }
              return true;
            }

            async function syncParentFromChildStatus(childIssueNumber, targetStatus, sourceLabel) {
              let parentIssue;
              try {
                const parentResp = await github.request("GET /repos/{owner}/{repo}/issues/{issue_number}/parent", {
                  owner,
                  repo,
                  issue_number: childIssueNumber,
                  headers: { "X-GitHub-Api-Version": "2022-11-28" },
                });
                parentIssue = parentResp.data;
              } catch (e) {
                core.info(`Issue #${childIssueNumber} has no parent issue, skip parent sync.`);
                return;
              }

              // For "已实现", only promote parent when all sub-issues are already in "已实现".
              if (targetStatus === "已实现") {
                const subIssuesResp = await github.request("GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues", {
                  owner,
                  repo,
                  issue_number: parentIssue.number,
                  headers: { "X-GitHub-Api-Version": "2022-11-28" },
                });
                const subIssues = subIssuesResp.data || [];
                if (!subIssues.length) {
                  core.info(`Parent #${parentIssue.number} has no sub-issues, skip parent implemented promotion.`);
                  return;
                }

                for (const sub of subIssues) {
                  const subIssueResp = await github.graphql(issueQuery, {
                    owner,
                    repo,
                    issueNumber: sub.number,
                  });
                  const subIssue = subIssueResp.repository?.issue;
                  if (!subIssue) {
                    core.info(`Sub-issue #${sub.number} cannot be loaded, skip parent implemented promotion.`);
                    return;
                  }
                  const subItem = (subIssue.projectItems.nodes || []).find((n) => n?.project?.id === project.id);
                  if (!subItem) {
                    core.info(`Sub-issue #${sub.number} is not in project #${projectNumber}, skip parent implemented promotion.`);
                    return;
                  }
                  const subStatusValue = (subItem.fieldValues.nodes || []).find(
                    (v) => v?.field?.id === statusField.id
                  );
                  const subStatusName = subStatusValue?.name || "(empty)";
                  if (subStatusName !== "已实现") {
                    core.info(`Sub-issue #${sub.number} status is '${subStatusName}', not '已实现'. Parent will not move to '已实现'.`);
                    return;
                  }
                }
              }

              await setIssueProjectStatus(
                parentIssue.number,
                targetStatus,
                `${sourceLabel}; sync from child #${childIssueNumber}`
              );
            }

            if (context.eventName === "push") {
              const commits = context.payload.commits || [];
              if (!commits.length) {
                core.info("No commits found in payload, nothing to do.");
                return;
              }

              const actions = [];
              for (const commit of commits) {
                const message = commit.message || "";
                let match;
                while ((match = commandRegex.exec(message)) !== null) {
                  actions.push({
                    issueNumber: Number(match[2]),
                    command: String(match[1]).toLowerCase(),
                    sha: commit.id,
                  });
                }
                commandRegex.lastIndex = 0;
              }

              if (!actions.length) {
                core.info("No transition commands found in commit messages.");
                return;
              }

              core.info(`Found ${actions.length} transition command(s).`);
              for (const action of actions) {
                const targetStatus = commitTransitions[action.command];
                if (!targetStatus) {
                  core.warning(`No transition mapping for command '${action.command}', skipped #${action.issueNumber}`);
                  continue;
                }
                await setIssueProjectStatus(
                  action.issueNumber,
                  targetStatus,
                  `command: ${action.command}, commit: ${action.sha.slice(0, 7)}`
                );
                await syncParentFromChildStatus(
                  action.issueNumber,
                  targetStatus,
                  `command: ${action.command}, commit: ${action.sha.slice(0, 7)}`
                );
              }
              return;
            }

            if (context.eventName === "issues" && context.payload.action === "closed") {
              const childIssueNumber = context.payload.issue?.number;
              if (!childIssueNumber) {
                core.info("No issue number in payload, skip.");
                return;
              }

              let parentIssue;
              try {
                const parentResp = await github.request("GET /repos/{owner}/{repo}/issues/{issue_number}/parent", {
                  owner,
                  repo,
                  issue_number: childIssueNumber,
                  headers: { "X-GitHub-Api-Version": "2022-11-28" },
                });
                parentIssue = parentResp.data;
              } catch (e) {
                core.info(`Issue #${childIssueNumber} has no parent issue, skip parent auto-close.`);
                return;
              }

              const subIssuesResp = await github.request("GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues", {
                owner,
                repo,
                issue_number: parentIssue.number,
                headers: { "X-GitHub-Api-Version": "2022-11-28" },
              });
              const subIssues = subIssuesResp.data || [];
              const hasOpenSubIssue = subIssues.some((i) => i.state !== "closed");
              if (hasOpenSubIssue) {
                core.info(`Parent #${parentIssue.number} still has open sub-issues, skip.`);
                return;
              }

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: parentIssue.number,
                state: "closed",
              });
              core.info(`Closed parent issue #${parentIssue.number} because all sub-issues are closed.`);

              await setIssueProjectStatus(
                parentIssue.number,
                "已实现",
                `all sub-issues closed (trigger child #${childIssueNumber})`
              );
              return;
            }

            core.info(`Event '${context.eventName}' is not handled.`);
